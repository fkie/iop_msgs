name: ros2

on: [push, pull_request]

jobs:
  industrial_ci:
    strategy:
      matrix:
        env:
          - {ROS_DISTRO: jazzy, CMAKE_ARGS: '--event-handlers console_direct+'}
          - {ROS_DISTRO: kilted, CMAKE_ARGS: '--event-handlers console_direct+'}
          - {ROS_DISTRO: rolling, CMAKE_ARGS: '--event-handlers console_direct+'}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: 'ros-industrial/industrial_ci@master'
        env: ${{matrix.env}}
